version: 2
models:
  - name: stg_loans
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: grade
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D', 'E', 'F', 'G']
      - name: term_months
        data_tests:
          - accepted_values:
              arguments:
                values: [36, 60]
                quote: false
